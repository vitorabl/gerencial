<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIM+ — Painel</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --card2: #20243a; --border: #2a2f45;
    --accent: #5b6af0; --accent2: #22d3ee; --accent3: #f59e0b;
    --accent4: #10b981; --text: #e2e8f0; --muted: #94a3b8; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif;
    min-height: 100vh; margin: 0;
  }
  #auth-overlay {
    position: fixed; inset: 0; z-index: 999; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .box {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 36px 32px; width: 320px; text-align: center;
  }
  .logo {
    width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: white;
  }
  h2 { margin: 0 0 4px; font-size: 18px; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card2); color: var(--text); font-size: 14px; margin-bottom: 10px;
  }
  button {
    width: 100%; padding: 10px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--accent); color: white; font-weight: 600; font-size: 14px;
  }
  button:hover { background: var(--accent2); }
  #auth-error { color: var(--danger); font-size: 12px; min-height: 16px; margin-bottom: 8px; }
  a.back { display: inline-block; margin-top: 16px; font-size: 12px; color: var(--muted); text-decoration: none; }
  a.back:hover { color: var(--text); }

  #content { display: none; padding: 60px 24px; text-align: center; }
  #content .logo { width: 64px; height: 64px; font-size: 24px; }
  #content h1 { margin: 20px 0 8px; font-size: 22px; }
  #content p { color: var(--muted); max-width: 480px; margin: 0 auto; line-height: 1.6; }
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="box">
    <div class="logo">K+</div>
    <h2>KIM+</h2>
    <p class="sub">Digite a senha para acessar</p>
    <input id="auth-input" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')checkAuth()">
    <div id="auth-error"></div>
    <button onclick="checkAuth()">Entrar</button>
    <br><a class="back" href="../">&larr; Voltar</a>
  </div>
</div>

<div id="content">
  <div class="logo" style="margin:0 auto;">K+</div>
  <h1>Painel KIM+ em construção</h1>
  <p>O dashboard do projeto KIM+ ainda está sendo montado — assim que as planilhas de acompanhamento forem enviadas, este espaço passa a mostrar os dados reais, no mesmo padrão do painel Motiva.</p>
</div>

<script>
var SENHA_KIM = 'KimPlus@2026';
var AUTH_KEY = 'kimplus_auth';

(function(){
  if (sessionStorage.getItem(AUTH_KEY) === '1') {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } else {
    document.getElementById('auth-input').focus();
  }
})();

function checkAuth(){
  var v = document.getElementById('auth-input').value;
  if (v === SENHA_KIM) {
    sessionStorage.setItem(AUTH_KEY, '1');
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } else {
    document.getElementById('auth-error').textContent = 'Senha incorreta.';
  }
}
</script>

</body>
</html>
