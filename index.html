<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerencial — Painéis</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --card2: #20243a; --border: #2a2f45;
    --accent: #5b6af0; --accent2: #22d3ee; --accent3: #f59e0b;
    --accent4: #10b981; --text: #e2e8f0; --muted: #94a3b8; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif;
    min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 780px; width: 100%; text-align: center; }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; color: white;
  }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 36px; }
  .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 26px; width: 260px; text-decoration: none; color: var(--text);
    transition: all .2s; position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent);
  }
  .card.kim::before { background: var(--accent2); }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .card-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .card-tag {
    display: inline-block; margin-top: 14px; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 20px; background: var(--card2); color: var(--accent4);
  }
  .card-tag.soon { color: var(--accent3); }
  footer { margin-top: 40px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">G</div>
    <h1>Painéis Gerenciais</h1>
    <p class="sub">Escolha o painel que deseja acessar</p>
    <div class="cards">
      <a class="card motiva" href="motiva/">
        <div class="card-title">Motiva Financeiro</div>
        <div class="card-desc">GMV, receitas, comissões, clientes e segmentação da Motiva Benefícios.</div>
        <div class="card-tag">● Disponível</div>
      </a>
      <a class="card kim" href="kimplus/">
        <div class="card-title">KIM+</div>
        <div class="card-desc">Acompanhamento do projeto KIM+.</div>
        <div class="card-tag soon">● Em construção</div>
      </a>
    </div>
    <footer>Acesso restrito &middot; cada painel possui senha própria</footer>
  </div>
</body>
</html>
